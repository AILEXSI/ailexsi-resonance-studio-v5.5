<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LEXI reference-level preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05040a;
        color: #e8d2a8;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      header {
        padding: 10px 16px 6px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 4px 0 0;
        opacity: 0.72;
      }
      .live {
        padding: 8px 16px 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px 16px 24px;
      }
      figure {
        margin: 0;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        background: #07060a;
        border: 1px solid #2a2114;
      }
      figcaption {
        margin-top: 6px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LEXI reference-level — flagship vs Minimal Horizon</h1>
      <p>
        Canvas V1 toward the attached CGI niveau. Same presented packet. Live + quiet / pad / kick / snare. Not
        HUMAN-PROVEN.
      </p>
    </header>
    <div class="live">
      <figure>
        <canvas id="live" width="1440" height="640"></canvas>
        <figcaption>LEXI flagship — live (pad energy, slow cinematic)</figcaption>
      </figure>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { lexiScene } from "./src/core/visualz/scenes/lexi.ts";
      import { lexiMinimalScene } from "./src/core/visualz/scenes/lexi-minimal.ts";

      const spectrum = (n, fn) => Float32Array.from({ length: n }, (_, i) => fn(i));

      const packets = {
        quiet: {
          timeMs: 2400,
          rms: 0.05,
          bass: 0.04,
          mid: 0.03,
          treble: 0.02,
          spectrum: spectrum(32, () => 0.03),
          onset: false,
          beatPulse: 0,
        },
        pad: {
          timeMs: 2400,
          rms: 0.62,
          bass: 0.28,
          mid: 0.58,
          treble: 0.2,
          spectrum: spectrum(32, (i) => 0.18 + (i % 5) * 0.04),
          onset: false,
          beatPulse: 0.08,
        },
        kick: {
          timeMs: 2400,
          rms: 0.74,
          bass: 0.7,
          mid: 0.34,
          treble: 0.12,
          spectrum: spectrum(32, (i) => (i < 6 ? 0.7 : 0.08)),
          onset: true,
          beatPulse: 0.92,
        },
        snare: {
          timeMs: 2400,
          rms: 0.4,
          bass: 0.16,
          mid: 0.38,
          treble: 0.74,
          spectrum: spectrum(32, (i) => (i > 18 ? 0.55 : 0.1)),
          onset: true,
          beatPulse: 0.55,
        },
      };

      const grid = document.getElementById("grid");

      function paint(scene, features, label, w = 960, h = 420) {
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        scene.onEnter?.({ width: w, height: h, ctx }, scene.defaultParams);
        for (let i = 0; i < 8; i++) {
          scene.render(
            { width: w, height: h, ctx },
            { ...features, timeMs: features.timeMs + i * (1000 / 30) },
            scene.defaultParams,
            1 / 30,
          );
        }
        const fig = document.createElement("figure");
        const cap = document.createElement("figcaption");
        cap.textContent = label;
        fig.append(canvas, cap);
        grid.append(fig);
      }

      paint(lexiScene, packets.pad, "LEXI ref-level — pad (hero)", 1280, 520);
      paint(lexiMinimalScene, packets.pad, "LEXI Minimal Horizon — pad", 1280, 520);
      for (const [name, features] of Object.entries(packets)) {
        paint(lexiScene, features, `LEXI ref-level — ${name}`);
        paint(lexiMinimalScene, features, `LEXI Minimal Horizon — ${name}`);
      }

      const live = document.getElementById("live");
      const lctx = live.getContext("2d");
      lexiScene.onEnter?.({ width: live.width, height: live.height, ctx: lctx }, lexiScene.defaultParams);
      let t0 = performance.now();
      let last = t0;
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const t = now - t0;
        const pulse = 0.5 + 0.5 * Math.sin(t / 1400);
        const features = {
          ...packets.pad,
          timeMs: t,
          rms: 0.42 + pulse * 0.22,
          bass: 0.22 + pulse * 0.2,
          mid: 0.4 + 0.16 * Math.sin(t / 1800),
          treble: 0.16 + 0.12 * Math.max(0, Math.sin(t / 520)),
          beatPulse: Math.max(0, Math.sin(t / 620)) ** 8 * 0.85,
          onset: Math.max(0, Math.sin(t / 620)) > 0.92,
        };
        lexiScene.render({ width: live.width, height: live.height, ctx: lctx }, features, lexiScene.defaultParams, dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
